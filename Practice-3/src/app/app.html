
<h2>Додати студента</h2>

<input
  type="text"
  placeholder="Ім'я"
  [(ngModel)]="newName"
>

<br><br>

<input
  type="number"
  placeholder="Вік"
  [(ngModel)]="newAge"
>

<br><br>

<input
  type="number"
  placeholder="Середня оцінка"
  [(ngModel)]="newGrade"
>

<br><br>

<button
  (click)="addStudent()"
>
  Додати студента
</button>



<h1>Студенти групи</h1>

<h2>Список студентів</h2>

@for (student of students(); track student.id) {

  <div>
    <h3>{{ student.name }}</h3>

    <p>Вік: {{ student.age }}</p>

    <p>Середня оцінка: {{ student.grade }}</p>

    <button (click)="removeStudent(student.id)">
      Видалити
    </button>
  </div>

  <hr>
}
